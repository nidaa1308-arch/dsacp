name: Deploy dsa-course-extension

# Manual only. Pick branch dsa-course-extension in "Use workflow from".
on:
  workflow_dispatch:

concurrency:
  group: deploy-dsa-course-extension
  cancel-in-progress: true

jobs:
  vercel:
    name: Vercel (frontend preview)
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check secrets
        run: |
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID RENDER_BACKEND_URL; do
            [ -n "${!v}" ] || { echo "::error::Missing secret $v"; exit 1; }
          done
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VITE_API_URL: ${{ secrets.RENDER_BACKEND_URL }}
      - id: deploy
        run: echo "url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"
      - run: echo "Vercel preview ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"

  render:
    name: Render (backend)
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy of this exact commit
        run: |
          [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ] || { echo "::error::Missing secret RENDER_DEPLOY_HOOK_URL"; exit 1; }
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}&ref=${{ github.sha }}"
